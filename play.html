<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Apex Loop</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0e1116">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" type="image/png" href="favicon.png"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{--bg:#0e1116;--fg:#f2f4f8;--acc:#ffb020;--pane:rgba(14,17,22,.84)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif;overflow:hidden;touch-action:none;user-select:none}
canvas{display:block;width:100%;height:100%}
button{font:inherit;font-weight:700;border:0;border-radius:12px;background:var(--acc);color:#111;padding:12px 24px;font-size:17px}
#hud{display:none;position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;justify-content:space-between;padding:10px 16px;font-weight:700;font-size:20px;pointer-events:none;text-shadow:0 1px 4px #000}
#hud small{display:block;font-weight:500;font-size:12px;opacity:.85}
#nb{width:110px;height:8px;border-radius:4px;background:rgba(255,255,255,.25);margin-top:4px;margin-left:auto;overflow:hidden}
#nf{height:100%;width:0;background:#29b6ff}
#mu{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);left:50%;transform:translateX(-50%);padding:4px 12px;font-size:16px;background:var(--pane);color:var(--fg)}
#menu{position:fixed;inset:0;display:none;pointer-events:none}#menu>*{pointer-events:auto}
.hm{position:absolute;left:0;top:0;bottom:0;width:min(54vw,340px);display:flex;flex-direction:column;justify-content:center;gap:12px;padding:16px 16px 16px max(18px,env(safe-area-inset-left));background:linear-gradient(90deg,rgba(14,17,22,.88) 70%,transparent)}
.logo{font-size:48px;font-weight:900;font-style:italic;letter-spacing:2px;line-height:1;background:linear-gradient(#ffe27a,#ff9a1f);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:8px}
.logo small{display:block;font-size:13px;letter-spacing:4px;-webkit-text-fill-color:var(--fg);font-style:normal;font-weight:600}
.btn{display:flex;align-items:center;gap:14px;border-radius:14px;padding:0 16px 0 0;height:52px;width:100%;overflow:hidden;font-size:18px;font-weight:800;color:#fff;box-shadow:0 3px 0 rgba(0,0,0,.45)}
.btn b{width:52px;height:52px;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.28);font-size:22px;flex:none}
.btn.o{background:#d9660a}.btn.g{background:#1e9e3e}.btn.b{background:#2b4a68}.btn.k{background:#454a52}
.tb{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);left:12px;right:12px;display:flex;align-items:center;gap:12px}
.back{width:44px;height:44px;padding:0;border-radius:10px;background:rgba(14,17,22,.8);color:var(--fg);font-size:18px}
.tt{font-size:22px;font-weight:800;letter-spacing:1px;text-shadow:0 2px 6px #000}
.info{position:absolute;right:12px;top:calc(env(safe-area-inset-top,0px) + 64px);width:min(44vw,230px);background:rgba(14,17,22,.8);border-radius:14px;padding:12px}
#cn{font-size:24px;font-weight:800}
.st{display:flex;align-items:center;gap:8px;font-size:12px;margin-top:6px}.st i{width:74px;text-align:right;font-style:normal;opacity:.85}
.st u{flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,.2);overflow:hidden;text-decoration:none}.st u s{display:block;height:100%;background:var(--acc)}
.sw{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.dot{width:26px;height:26px;padding:0;border-radius:50%;border:2px solid rgba(255,255,255,.6)}
.gb{position:absolute;left:0;right:0;bottom:0;padding:24px 12px calc(10px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;align-items:center;background:linear-gradient(transparent,rgba(14,17,22,.88) 45%)}
.cards{display:flex;gap:8px;overflow-x:auto;max-width:100%;padding:4px;touch-action:pan-x}
.card{flex:none;min-width:104px;padding:10px 12px;border-radius:12px;font-size:15px;background:rgba(40,52,68,.94);color:#fff;border:2px solid transparent;display:flex;flex-direction:column;align-items:center;gap:4px}
.card.sel{border-color:var(--acc);background:rgba(80,66,28,.96)}.card span{width:28px;height:14px;border-radius:4px}.card small{font-weight:500;font-size:11px;opacity:.85}
.gb .btn{width:min(260px,70vw)}
.pn{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(88vw,380px);background:rgba(14,17,22,.9);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px;text-align:center}
.pn h1{margin:0;font-size:30px}.pn p{margin:0}
.tg{display:flex;justify-content:space-between;align-items:center;background:rgba(255,255,255,.1);color:var(--fg);padding:12px 14px;font-size:17px}
.tg b{padding:4px 12px;border-radius:8px;background:#555;color:#fff;font-size:14px}.tg b.on{background:#1e9e3e}
#pad{display:none;position:fixed;left:0;right:0;bottom:env(safe-area-inset-bottom,0px);justify-content:space-between;align-items:flex-end;padding:14px}
.g{display:flex;gap:10px}.g2{display:grid;grid-template-columns:repeat(2,64px);gap:10px}
#pad b{width:64px;height:64px;border-radius:50%;background:var(--pane);border:2px solid rgba(255,255,255,.35);display:flex;align-items:center;justify-content:center;font-size:14px}
#pad b.on{background:var(--acc);color:#111}
.btn.p{background:#6a3fd0}
.hm{gap:8px;overflow-y:auto}.btn{height:46px}.btn b{width:46px;height:46px}.logo{font-size:42px;margin-bottom:4px}
#ex{display:none;position:fixed;left:12px;top:calc(env(safe-area-inset-top,0px) + 64px);width:40px;height:40px;padding:0;border-radius:10px;background:var(--pane);color:var(--fg);font-size:18px}
#dr{display:none;position:fixed;top:calc(env(safe-area-inset-top,0px) + 44px);left:50%;transform:translateX(-50%);text-align:center;pointer-events:none;text-shadow:0 2px 6px #000;font-weight:800}
#dt{font-size:30px}#dc{font-size:20px;color:var(--acc);min-height:24px}

/* ===== NEW HOME SCREEN (Apex Loop neon look) ===== */
.home{--bh:clamp(44px,6.4vh,58px);position:absolute;inset:0;overflow:hidden}
.home::before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(20,26,80,.55) 0%,rgba(70,30,100,.15) 38%,rgba(8,12,28,.12) 60%,rgba(5,8,20,.82) 100%)}
.home button{font:inherit;padding:0;border:0;color:#fff}
.hx-c{position:absolute;width:34px;height:34px;border:2px solid rgba(110,200,255,.55);pointer-events:none;filter:drop-shadow(0 0 4px rgba(80,180,255,.6))}
.hx-c.a{top:6px;left:6px;border-right:0;border-bottom:0;border-top-left-radius:8px}
.hx-c.b{top:6px;right:6px;border-left:0;border-bottom:0;border-top-right-radius:8px}
.hx-c.c{bottom:6px;left:6px;border-right:0;border-top:0;border-bottom-left-radius:8px}
.hx-c.d{bottom:6px;right:6px;border-left:0;border-top:0;border-bottom-right-radius:8px}
.hx-top{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);right:14px;display:flex;align-items:flex-start;gap:8px}
.hx-col{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.hx-cur{display:flex;align-items:center;gap:14px;height:36px;padding:0 6px 0 8px;border-radius:20px;background:rgba(10,18,40,.72);border:1px solid rgba(120,200,255,.4);backdrop-filter:blur(6px);font-weight:800;font-size:15px}
.hx-cur span{display:flex;align-items:center;gap:6px}
.hx-coin{width:24px;height:24px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3a0,#f5b400 60%,#b87800);border:2px solid #ffd95a;box-shadow:0 0 8px rgba(255,200,60,.8)}
.hx-gem{font-size:20px;filter:drop-shadow(0 0 5px #35c8ff)}
.hx-plus{width:24px;height:24px;border-radius:6px;background:#22c55e;font-size:20px;font-weight:900;line-height:1;display:flex;align-items:center;justify-content:center}
.hx-lv{font-size:11px;font-weight:700;color:#ddd;text-shadow:0 1px 3px #000}.hx-lv b{color:#ffb020}
.hx-av{width:56px;height:56px;border-radius:12px;background:rgba(40,50,72,.88);border:2px solid rgba(190,210,235,.6);overflow:hidden;display:flex;align-items:flex-end;justify-content:center}
.hx-logo{position:absolute;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 7vh);width:min(70vw,320px);aspect-ratio:300/220;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.hx-logo svg{position:absolute;inset:0;width:100%;height:100%;filter:drop-shadow(0 0 8px rgba(80,170,255,.7))}
.hx-a,.hx-l{position:relative;font-weight:900;font-style:italic;letter-spacing:2px;line-height:.92;font-size:min(19vw,88px);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:1px rgba(255,255,255,.55)}
.hx-a{background-image:linear-gradient(#ffe08a,#ff7a3d 55%,#ff3d8b);filter:drop-shadow(0 0 8px rgba(255,110,50,.75))}
.hx-l{background-image:linear-gradient(#9af0ff,#2f9bff 55%,#5a6bff);filter:drop-shadow(0 0 8px rgba(60,170,255,.8))}
.hx-r{position:relative;margin-top:2px;font-size:min(4.6vw,20px);font-weight:800;letter-spacing:3px;font-style:italic;color:#6fd6ff;text-shadow:0 0 8px #1e8fff}
.hx-panel{position:absolute;left:max(14px,3vw);bottom:24%;width:min(60vw,380px);display:flex;flex-direction:column;gap:10px;padding:12px;border-radius:22px;background:rgba(255,255,255,.13);border:1.5px solid rgba(200,225,255,.5);backdrop-filter:blur(8px);box-shadow:0 0 22px rgba(90,170,255,.3),inset 0 0 18px rgba(255,255,255,.06)}
.mb{display:flex;align-items:center;width:100%;height:var(--bh);border-radius:16px;overflow:hidden;text-align:left;font-weight:800;letter-spacing:.5px;font-size:clamp(17px,2.7vh,24px);text-shadow:0 2px 4px rgba(0,0,0,.55);border:2px solid var(--bd);background:var(--bg);box-shadow:0 0 14px var(--gl),inset 0 1px 0 rgba(255,255,255,.55),inset 0 -8px 12px rgba(0,0,0,.18)}
.mb i{flex:none;width:calc(var(--bh)*1.5);height:100%;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:calc(var(--bh)*.52);background:rgba(0,0,0,.28);border-right:1px solid rgba(255,255,255,.22)}
.mb span{padding-left:18px}
.mb:active{transform:scale(.97);filter:brightness(1.15)}
.mb.o{--bg:linear-gradient(90deg,#ff5a00,#ff8a1f);--bd:#ffb25c;--gl:rgba(255,120,0,.55)}
.mb.p{--bg:linear-gradient(90deg,#6a35d8,#9a55f0);--bd:#c39bff;--gl:rgba(150,90,255,.5)}
.mb.g{--bg:linear-gradient(90deg,#0fae82,#19d68a);--bd:#6cf0bd;--gl:rgba(30,220,150,.45)}
.mb.t{--bg:linear-gradient(90deg,#1e7fc4,#2bb0d8);--bd:#6fd6f5;--gl:rgba(50,180,230,.45)}
.mb.k{--bg:linear-gradient(90deg,#444950,#6b7078);--bd:#b5bac2;--gl:rgba(180,190,200,.3)}
.hx-ic{position:absolute;left:18px;bottom:calc(env(safe-area-inset-bottom,0px) + 50px);display:grid;grid-template-columns:repeat(2,46px);gap:8px}
.hx-ic button{width:46px;height:40px;border-radius:10px;background:rgba(40,50,72,.85);border:1px solid rgba(190,210,235,.5);font-size:20px}
.hx-v{position:absolute;left:24px;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);font-size:14px;color:rgba(255,255,255,.6)}
.hx-tap{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 16px);background:none;font-size:15px;color:rgba(255,255,255,.7)!important;text-shadow:0 1px 4px #000;animation:hxp 1.8s ease-in-out infinite}
@keyframes hxp{50%{opacity:.35}}
@media (orientation:landscape) and (max-height:520px){
 .home{--bh:38px}
 .hx-logo{top:calc(env(safe-area-inset-top,0px) + 4px);width:min(30vw,190px)}
 .hx-a,.hx-l{font-size:min(9vw,48px)}.hx-r{font-size:10px}
 .hx-panel{bottom:12px;gap:6px;padding:8px;width:min(40vw,330px)}
 .hx-ic{left:auto;right:18px;bottom:36px;grid-template-columns:repeat(4,46px)}
 .hx-v{left:auto;right:24px;bottom:12px}
 .hx-tap{bottom:8px;font-size:13px}
}

#ld{position:fixed;inset:0;z-index:100;display:none;background:#05070f center/cover no-repeat;opacity:1;transition:opacity .4s}
#ld.out{opacity:0}
#ld .lb{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 26px);width:min(60vw,360px);text-align:center;font-weight:800;letter-spacing:3px;font-size:13px;color:#fff;text-shadow:0 1px 4px #000}
#ld .lb u{display:block;height:6px;margin-top:8px;border-radius:3px;background:rgba(255,255,255,.25);overflow:hidden;text-decoration:none}
#ld .lb s{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff7a1f,#2bb0ff);box-shadow:0 0 8px #2bb0ff}
#ld.go .lb s{width:100%;transition:width 4s linear}
.mny{margin-left:auto;background:rgba(10,18,40,.78);border:1px solid rgba(255,210,80,.55);border-radius:18px;padding:6px 12px;font-weight:800;font-size:15px}
.btn.sm{height:38px;font-size:15px;margin-top:8px;padding:0 10px;justify-content:center;width:100%;border-radius:10px;color:#fff}
.btn.sm.o{background:#d9660a}.btn.sm.k{background:#454a52}
.eqd{margin-top:8px;color:#7cfc9a;font-weight:800;font-size:14px}
.card small.lk{color:#ffd54f;opacity:1;font-weight:700}
#mny{display:block;font-size:13px;font-weight:700;margin-top:2px}
.mb.r{--bg:linear-gradient(90deg,#d32f2f,#f4511e);--bd:#ff8a65;--gl:rgba(255,80,50,.5)}
.xpb{height:5px;width:90px;border-radius:3px;background:rgba(255,255,255,.25);margin-top:3px;overflow:hidden;margin-left:auto}
.xpb s{display:block;height:100%;background:#ffb020}
.lvg{position:absolute;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 66px);bottom:12px;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px;align-content:start;touch-action:pan-y;padding:4px}
.lc{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 6px;border-radius:12px;background:rgba(40,52,68,.94);color:#fff;border:2px solid rgba(255,176,32,.6)}
.lc b{font-size:24px}.lc small{font-size:11px;opacity:.85;font-weight:500}.lc span{font-size:13px;color:#ffb020;letter-spacing:1px}
.lc.lk{opacity:.5;border-color:transparent}
.hx-panel{bottom:18%!important}
.info{max-height:calc(100vh - 200px);overflow-y:auto;touch-action:pan-y}
.up{display:flex;justify-content:space-between;align-items:center;width:100%;height:30px;margin-top:5px;padding:0 8px;border-radius:8px;font-size:12px;background:#d9660a;color:#fff}
.up.k{background:#454a52}
.upt{font-size:12px;font-weight:800;margin-top:8px;color:#ffb020}
#ft{position:fixed;top:28%;left:50%;transform:translateX(-50%);font-size:28px;font-weight:900;color:#ffd54f;text-shadow:0 3px 10px #000;pointer-events:none;opacity:0;white-space:nowrap}#ft.on{animation:ftp 1.5s ease-out forwards}@keyframes ftp{0%{opacity:0;transform:translate(-50%,10px) scale(.7)}15%{opacity:1;transform:translate(-50%,0) scale(1.1)}70%{opacity:1}100%{opacity:0;transform:translate(-50%,-22px) scale(1)}}
#pad #pwb{grid-column:1/3;width:auto;height:50px;border-radius:26px;flex-direction:row;gap:8px;font-size:14px;font-weight:800;opacity:.8}
#pad #pwb span{font-size:24px}#pad #pwb em{font-style:normal}
#pad #pwb.rdy{background:linear-gradient(#ffb020,#ff6d00);color:#111;border-color:#fff;opacity:1;animation:pwp .8s infinite alternate}
@keyframes pwp{to{transform:scale(1.08)}}
#tut{display:none;position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 64px);transform:translateX(-50%);width:min(90vw,400px);background:rgba(10,18,40,.9);border:2px solid #ffb020;border-radius:14px;padding:10px 14px;text-align:center;z-index:30;pointer-events:auto}
#tut b{color:#ffb020;font-size:12px;letter-spacing:1px}#tut #tutt{font-size:17px;font-weight:800;margin:4px 0}#tut small{display:block;opacity:.85;font-size:12px}
#tut u{display:block;height:5px;background:rgba(255,255,255,.2);border-radius:3px;margin-top:7px;overflow:hidden}#tut u s{display:block;height:100%;width:0;background:#7cfc9a}
#tut button{position:static;display:block;margin:9px auto 0;padding:7px 18px;font-size:13px;font-weight:800;letter-spacing:.5px;border-radius:10px;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.4);color:#fff}
#tq{display:none;position:fixed;inset:0;z-index:150;background:rgba(3,6,18,.82);align-items:center;justify-content:center;padding:20px}
#tq .tqc{width:min(92vw,380px);background:linear-gradient(#111a38,#0a1026);border:2px solid #ffb020;border-radius:20px;padding:22px 18px;text-align:center;box-shadow:0 0 30px rgba(255,176,32,.35)}
#tq h2{margin:0 0 8px;font-size:24px;color:#ffb020}#tq p{margin:0 0 16px;color:#dbe6ff;font-size:15px;line-height:1.45}
#tq button{display:block;width:100%;margin-top:10px;padding:0;height:50px;border-radius:14px;border:2px solid #fff3;font-weight:800;font-size:17px;color:#fff}
#tq #tqy{background:linear-gradient(90deg,#ff5a00,#ff8a1f);border-color:#ffb25c}#tq #tqn{background:rgba(255,255,255,.12)}
#tq small{display:block;margin-top:12px;color:#a9b4cc;font-size:12px}
#pad b.hl{box-shadow:0 0 0 4px #ffb020,0 0 22px #ffb020;animation:hlp .7s infinite alternate}@keyframes hlp{to{transform:scale(1.12)}}

.hx-ic button.gold{background:linear-gradient(#ffcf4d,#ff9d00);border-color:#ffe08a;box-shadow:0 0 12px rgba(255,176,32,.7);animation:hlp 1s infinite alternate}
#nm{display:none;position:fixed;inset:0;z-index:160;background:rgba(3,6,18,.85);align-items:center;justify-content:center;padding:20px}
#nm .tqc{width:min(92vw,360px);background:linear-gradient(#111a38,#0a1026);border:2px solid #2bb0ff;border-radius:20px;padding:22px 18px;text-align:center;box-shadow:0 0 30px rgba(43,176,255,.35)}
#nm h2{margin:0 0 6px;font-size:24px;color:#7fd4ff}#nm p{margin:0 0 14px;color:#dbe6ff;font-size:14px}
#nm input{width:100%;height:50px;border-radius:12px;border:2px solid #2bb0ff;background:#0a1026;color:#fff;font-size:20px;font-weight:700;text-align:center;outline:none;padding:0 10px}
#nm button{display:block;width:100%;margin-top:12px;height:50px;border-radius:14px;border:2px solid #6cf0bd;background:linear-gradient(90deg,#0fae82,#19d68a);font-weight:800;font-size:17px;color:#fff;padding:0}
.lbw{position:absolute;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 66px);bottom:12px;overflow-y:auto;touch-action:pan-y;padding:2px}
.lbh,.lbr{display:grid;grid-template-columns:38px 1fr 56px 58px;gap:6px;align-items:center;padding:10px 12px;border-radius:12px}
.lbh{color:#a9b4cc;font-size:12px;font-weight:700;letter-spacing:1px;background:rgba(14,17,22,.6);margin-bottom:6px}
.lbr{background:rgba(14,17,22,.86);margin-bottom:6px;font-size:15px}
.lbr.me{border:2px solid #ffb020;background:rgba(60,40,5,.88)}
.lbr .rk{font-weight:900;font-size:18px;text-align:center}
.lbr .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:800}.lbr .nm small{display:block;opacity:.7;font-weight:600;font-size:11px}
.lbr em{font-style:normal;color:#7cfc9a;font-weight:800;text-align:center}.lbr u{text-decoration:none;color:#ffb020;font-weight:800;text-align:right}
.lbm{text-align:center;color:#dbe6ff;padding:34px 10px;line-height:1.6;background:rgba(14,17,22,.7);border-radius:14px}
.lbb{display:block;margin:12px auto 0;padding:0 22px;height:44px;border-radius:12px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.4);color:#fff;font-weight:800;font-size:15px}
</style></head><body>
<canvas id="c"></canvas>
